name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release -j 4
      - name: package
        shell: bash
        run: |
          mkdir out
          cp build/blockcraft out/ 2>/dev/null || cp build/Release/blockcraft.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: blockcraft-${{ matrix.os }}
          path: out
